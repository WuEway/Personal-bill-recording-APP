[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mz"
version = "2.0.0"
description = "个人月度对账系统 — 多账单聚合、跨平台去重、重点类目限额跟踪"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.10",
    "pypdf>=5.0",
]

[project.scripts]
mz = "mz.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["mz*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
